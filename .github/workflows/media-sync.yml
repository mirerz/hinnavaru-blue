name: HBI Media Automation Pipeline

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Media Sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync-media.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "HBI Automation Bot"
          git config --global user.email "bot@hinnavarublueinitiative.org"
          git add src/data/cms.js public/media-hub/
          git diff --quiet && git diff --staged --quiet || (git commit -m "automation: sync media hub from Google Drive [skip ci]" && git push origin main)
        continue-on-error: true

      - name: Build and Deploy
        run: |
          npm install # Ensure sharp is available for the build if needed
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
        
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
